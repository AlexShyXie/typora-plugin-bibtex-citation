name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的 tag 名，例如 1.0.0'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pack plugin.zip
        run: zip plugin.zip main.js manifest.json style.css

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ inputs.version || github.ref_name }}"
          --title "${{ inputs.version || github.ref_name }}"
          --verify-tag
          plugin.zip
