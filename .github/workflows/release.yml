name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的 tag 名，例如 1.0.0'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Pack plugin.zip
        run: zip -r plugin.zip main.js manifest.json style.css package.json src node_modules tests

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ inputs.version || github.ref_name }}"
          --title "${{ inputs.version || github.ref_name }}"
          --verify-tag plugin.zip
          || gh release upload "${{ inputs.version || github.ref_name }}" plugin.zip --clobber
